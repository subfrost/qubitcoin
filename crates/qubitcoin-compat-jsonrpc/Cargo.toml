[workspace]

[package]
name = "qubitcoin-compat-jsonrpc"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC reverse proxy: qubitcoind API surface → bitcoind + metashrew + esplora"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-auto"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
env_logger = "0.11"
log = "0.4"
bytes = "1"
hex = "0.4"
