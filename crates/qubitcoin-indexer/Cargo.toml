[package]
name = "qubitcoin-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process WASM secondary indexer runtime for Qubitcoin"

[dependencies]
qubitcoin-indexer-core = { workspace = true }
qubitcoin-indexer-fork = { path = "../qubitcoin-indexer-fork", default-features = false }
qubitcoin-consensus = { workspace = true }
qubitcoin-serialize = { workspace = true }
qubitcoin-primitives = { workspace = true }
qubitcoin-script = { workspace = true }
qubitcoin-crypto = { workspace = true }
hex = { workspace = true }
rocksdb = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
wasmtime = "43"
prost = "0.12"
sha2 = "0.10"
toml = "0.8"
# Metashrew runtime — the production WASM indexer engine.
# Using the real metashrew crates ensures exact storage format
# compatibility with the alkanes.wasm and other indexer modules.
metashrew-runtime = { git = "https://github.com/kungfuflex/metashrew", branch = "master" }
rockshrew-runtime = { git = "https://github.com/kungfuflex/metashrew", branch = "master" }
metashrew-sync = { git = "https://github.com/kungfuflex/metashrew", branch = "master" }
async-trait = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
wat = "1.0"
bitcoin = "0.32"

[build-dependencies]
prost-build = "0.12"
