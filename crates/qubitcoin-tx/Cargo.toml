[package]
name = "qubitcoin-tx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transaction utility binary for Qubitcoin"

[[bin]]
name = "qubitcoin-tx"
path = "src/main.rs"

[lib]
name = "qubitcoin_tx"
path = "src/lib.rs"

[dependencies]
qubitcoin-primitives = { workspace = true }
qubitcoin-consensus = { workspace = true }
qubitcoin-serialize = { workspace = true }
qubitcoin-util = { workspace = true, features = ["native"] }
qubitcoin-script = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
