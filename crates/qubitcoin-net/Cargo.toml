[package]
name = "qubitcoin-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "P2P networking for Qubitcoin: tokio-based, protocol messages, peer management"

[dependencies]
qubitcoin-common = { workspace = true, features = ["native"] }
qubitcoin-node = { workspace = true, features = ["filesystem", "parallel"] }
qubitcoin-util = { workspace = true, features = ["native"] }
qubitcoin-serialize = { workspace = true }
qubitcoin-primitives = { workspace = true }
qubitcoin-crypto = { workspace = true, features = ["native"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
bitflags = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
