[package]
name = "qubitcoin-wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wallet implementation for Qubitcoin: descriptor wallet, coin selection, PSBT"

[dependencies]
qubitcoin-common = { workspace = true, features = ["native"] }
qubitcoin-node = { workspace = true, features = ["filesystem", "parallel"] }
qubitcoin-util = { workspace = true, features = ["native"] }
qubitcoin-primitives = { workspace = true }
qubitcoin-crypto = { workspace = true, features = ["native"] }
qubitcoin-consensus = { workspace = true }
qubitcoin-script = { workspace = true }
qubitcoin-serialize = { workspace = true }
thiserror = { workspace = true }
secp256k1 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
