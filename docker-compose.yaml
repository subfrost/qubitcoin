services:
  qubitcoind:
    build: .
    container_name: qubitcoind
    restart: unless-stopped
    ports:
      - "8333:8333"   # P2P
      - "8332:8332"   # RPC
    volumes:
      - qbc-data:/home/qubitcoin/.qubitcoin
    # SECURITY: this binds the RPC to 0.0.0.0 and publishes port 8332. Admin
    # methods (wallet, stop) now require the credentials below for any non-
    # loopback caller, but:
    #   * `-rpcuser=qubitcoin -rpcpassword=qubitcoin` are EXAMPLE credentials.
    #     Change them before exposing this container to any untrusted network.
    #   * `-rpcallowip` is NOT enforced by qubitcoind (unlike Bitcoin Core); the
    #     only network-level control is the bind address. Restrict exposure with
    #     the firewall / published-port mapping, or bind to 127.0.0.1.
    #   * Public (read-only) methods and sendrawtransaction remain reachable
    #     without credentials by design.
    command:
      - qubitcoind
      - -dbcache=2048
      - -maxconnections=32
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=qubitcoin
      - -rpcpassword=qubitcoin
      - -printtoconsole
    deploy:
      resources:
        limits:
          memory: 8g
    stop_grace_period: 600s

volumes:
  qbc-data:
